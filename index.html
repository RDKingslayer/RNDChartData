<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi Threaded Charts</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; padding: 0 16px 16px; box-sizing: border-box; }

        /* The chart fills whatever space is left; the canvas follows this box on every resize */
        #chartContainer { flex: 1; min-height: 200px; position: relative; overflow: hidden; }
        #chartContainer canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    </style>
    <script src="./index.js" type="module"></script>
</head>
<body>
    <h4>RND on Data accessing using Array Buffers</h4>
    <div id="chartContainer"></div>
</body>
</html>
